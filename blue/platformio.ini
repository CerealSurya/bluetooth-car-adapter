; Honda Fit Bluetooth Audio Adapter — PCM5102A DAC version
; ESP32 A2DP sink -> I2S -> PCM5102A -> 3.5mm AUX jack
 
[env:esp32dev]
platform   = espressif32
board      = esp32dev
framework  = arduino
 
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP
    https://github.com/pschatzmann/arduino-audio-tools.git
 
; Bluetooth Classic needs the larger app partition
board_build.partitions = no_ota.csv
 
build_flags =
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_CLASSIC_BT_ENABLED=1
    -DCONFIG_BT_A2DP_ENABLE=1
    -DCONFIG_BT_SPP_ENABLED=0
    ; Change this to whatever you want to appear on your phone's BT list
    -DDEVICE_NAME='"Honda Fit BT"'
 
monitor_speed = 115200
 